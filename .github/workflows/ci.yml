name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: cli dist bundle is committed and current
        run: |
          if git diff --exit-code dist/; then
            exit 0
          fi
          echo "::error::cli/dist/hele.cjs is stale — agents/, skills/, templates/, and cli/src/ are embedded in the bundle. Rebuild and commit: cd cli && npm run build"
          exit 1
      - name: cursor adapter is committed and current
        working-directory: .
        run: |
          node scripts/build-cursor.mjs
          if git diff --exit-code dist/cursor; then
            exit 0
          fi
          echo "::error::dist/cursor is stale — agents/, skills/, and templates/ generate the Cursor adapter. Rebuild and commit: node scripts/build-cursor.mjs"
          exit 1

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin + marketplace manifests are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('templates/settings.json','utf8'))"

  release:
    runs-on: ubuntu-latest
    needs: [cli, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect version
        id: v
        run: echo "version=$(node -p "require('./.claude-plugin/plugin.json').version")" >> "$GITHUB_OUTPUT"
      - name: new version requires a CHANGELOG entry
        run: |
          V="${{ steps.v.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V already tagged — nothing to release"
            exit 0
          fi
          if ! grep -q "^## v$V " CHANGELOG.md && ! grep -q "^## v$V$" CHANGELOG.md; then
            echo "::error::version $V is new but CHANGELOG.md has no '## v$V' entry — every bump ships with its changelog"
            exit 1
          fi
      - name: tag the release
        run: |
          V="${{ steps.v.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "hele-skills v$V"
          git push origin "v$V"
